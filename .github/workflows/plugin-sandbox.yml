name: Plugin sandbox

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  native-sandbox:
    name: Native sandbox on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep native Linux coverage on the last-known-good runner. Ubuntu 26.04's
        # bwrap/AppArmor policy denies CAP_SYS_ADMIN to sandbox-runtime 0.0.81's
        # apply-seccomp helper (upstream #429); do not weaken the sandbox for CI.
        include:
          - os: macos-latest
            node: 24.x
          - os: ubuntu-24.04
            node: 24.x
          - os: ubuntu-24.04
            node: 22.21.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          # Ephemeral runner only: Ubuntu's AppArmor restriction otherwise blocks bwrap.
          # Never change a user's host settings automatically.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/plugin-sandbox-smoke.mjs
      - run: node scripts/plugin-binary-smoke.mjs --sandbox
