name: Plugin sandbox

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  native-sandbox:
    name: Native sandbox on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          # Ephemeral runner only: Ubuntu's AppArmor restriction otherwise blocks bwrap.
          # Never change a user's host settings automatically.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/plugin-sandbox-smoke.mjs
