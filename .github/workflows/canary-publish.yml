name: Canary release on new commit
on:
  push:
    branches:
      - 'v0.*.x'
    paths-ignore:
      - '**/package.json'

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1; Node 24 bundles npm 11.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Git identity
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions [Bot]"

      - name: Update package version
        run: |
          SHORT_COMMIT_ID=$(git log -1 --pretty=format:%h)
          BASE_VERSION=$(node -p "require('./package.json').version")
          # Append the canary suffix to the current version without bumping it,
          # e.g. 0.5.0 -> 0.5.0-canary-<commitid>
          npm pkg set version="${BASE_VERSION}-canary-${SHORT_COMMIT_ID}"

      - name: Build
        run: pnpm build

      - name: Ensure npm supports trusted publishing
        run: |
          node -v
          if [ "$(node -p "require('semver').gte('$(npm -v)', '11.5.1')")" != "true" ]; then
            npm install -g npm@^11.5.1
          fi
          npm -v

      # Authenticates via npm trusted publishing (GitHub OIDC); no npm token is used.
      # Provenance is generated automatically.
      - name: Canary release to npm
        run: npm publish --access public --tag canary
