overrides:
  # GHSA-7m2j-8qp9-m8jw: CRLF injection. Remove when no transitive dependency uses form-data >=4.0.0 <4.0.6.
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  # GHSA-mrhx-c7xc-m3w5: Zod collection-validation memory exhaustion. JoyID only uses
  # abitype's ABI types; its optional abitype/zod validators are unused by this CLI.
  # Remove the unused peer rather than forcing Zod 4 into abitype's Zod 3 API.
  "abitype@0.8.7>zod": "-"
  # GHSA-h67p-54hq-rp68: quadratic-complexity DoS in merge key handling. Remove when js-yaml 3.x >=3.15.0.
  # GHSA-5p4m-2wfm-xmqj: quadratic CPU consumption in !!omap resolution. Remove when js-yaml 3.x >=3.15.1.
  # GHSA-2883-xcg3-v3hh: maxTotalMergeKeys does not limit CPU use for empty merge sources. Remove when js-yaml 3.x >=3.15.2.
  "js-yaml@<3.15.2": "3.15.2"
  # GHSA-h67p-54hq-rp68 / GHSA-52cp-r559-cp3m: quadratic-complexity DoS in merge key handling. Remove when js-yaml 4.x >=4.3.0.
  # GHSA-5p4m-2wfm-xmqj: quadratic CPU consumption in !!omap resolution. Remove when js-yaml 4.x >=4.3.1.
  # GHSA-2883-xcg3-v3hh: maxTotalMergeKeys does not limit CPU use for empty merge sources. Remove when js-yaml 4.x >=4.3.2.
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  # GHSA-4x5r-pxfx-6jf8: arbitrary file read via sourceMappingURL. Remove when @babel/core >=7.29.6.
  "@babel/core@<=7.29.0": "7.29.7"
  # GHSA-3jxr-9vmj-r5cp: exponential-time expansion of consecutive non-expanding {} groups. Remove when brace-expansion 1.x >=1.1.16.
  # GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895: DoS via unbounded expansion length / unbounded intermediate arrays. Remove when brace-expansion 1.x >=1.1.18.
  # GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7: uncontrolled recursion in parseCommaParts / nested brace groups causing stack exhaustion. Remove when brace-expansion 1.x >=1.1.20.
  # GHSA-q2hr-2g5m-vwhr: quadratic-time expansion of the `{a},b}` rewrite. Remove when brace-expansion 1.x >=1.1.21.
  "brace-expansion@<1.1.21": "1.1.21"
  # GHSA-jxxr-4gwj-5jf2 / GHSA-3jxr-9vmj-r5cp: brace range / exponential-time expansion DoS. Remove when brace-expansion >=5.0.7.
  # GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895: DoS via unbounded expansion length / unbounded intermediate arrays. Remove when brace-expansion 5.x >=5.0.9.
  # GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7 / GHSA-q2hr-2g5m-vwhr: uncontrolled recursion stack exhaustion, quadratic-time `{a},b}` rewrite. Remove when brace-expansion 5.x >=5.0.12.
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"

onlyBuiltDependencies:
  - secp256k1

minimumReleaseAgeExclude:
  # Matches the overrides above; these versions are very recent but required for the security fixes.
  - "brace-expansion@1.1.21"
  - "brace-expansion@5.0.12"
  - "@babel/core@7.29.7"
  - "js-yaml@3.15.2"
  - "js-yaml@4.3.2"
  - "tar@7.5.21"

# Build-script approvals read by newer pnpm (11+ fails the install on any unlisted build script).
# - cpu-features: optional runtime dep of the CLI; src/node/install.ts falls back to the portable CKB
#   binary when it is not compiled, and it is kept external in the ncc bundle so end users build it
#   on their own install. Nothing in this repo's build/tests needs the native addon.
# - unrs-resolver: its postinstall only checks for the prebuilt @unrs/resolver-binding-* package.
allowBuilds:
  cpu-features: false
  unrs-resolver: false

packageExtensions:
  # node-fetch 2 pulls in these legacy URL packages. Pair with the patches
  # below to use userland punycode instead of Node's deprecated built-in (DEP0040).
  "tr46@0.0.3":
    dependencies:
      punycode: "^2.3.1"
  "whatwg-url@5.0.0":
    dependencies:
      punycode: "^2.3.1"

patchedDependencies:
  "tr46@0.0.3": patches/tr46@0.0.3.patch
  "whatwg-url@5.0.0": patches/whatwg-url@5.0.0.patch
